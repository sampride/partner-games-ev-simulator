x-simulator-common: &simulator-common
  build: .
  restart: unless-stopped
  init: true
  environment:
    PYTHONPATH: /app/src
    PYTHONUNBUFFERED: "1"
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  logging:
    driver: awslogs
    options: &awslogs-common
      awslogs-region: ${AWS_REGION:-ap-southeast-2}
      awslogs-group: ${CLOUDWATCH_LOG_GROUP:-/apg/partner-games-simulator}
      awslogs-create-group: "true"
      mode: non-blocking
      max-buffer-size: 4m

services:
  sim-tenant-1:
    <<: *simulator-common
    container_name: apg-sim-tenant-1
    environment:
      PYTHONPATH: /app/src
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SIM_CONFIG_PATH: /opt/apg/sim/tenant-1.yaml
      SIM_DATA_PATH: /data/tenant-1
    volumes:
      - /opt/apg/sim/tenant-1.yaml:/opt/apg/sim/tenant-1.yaml:ro
      - /data/apg-sim/tenant-1:/data/tenant-1:rw
    logging:
      driver: awslogs
      options:
        <<: *awslogs-common
        awslogs-stream: sim-tenant-1

